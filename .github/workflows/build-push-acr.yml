name: Build and Push Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout GitHub code
        uses: actions/checkout@v4

      # Step 2: Validate Azure secrets
      - name: Validate Azure secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          test "$CLIENT_ID" = "a907f788-008a-4d13-b65f-5e9301871301" \
            || { echo "ERROR: Client ID mismatch"; exit 1; }

          test "$TENANT_ID" = "b67ad627-6134-4210-8d55-1fba47bf7461" \
            || { echo "ERROR: Tenant ID mismatch"; exit 1; }

          test "$SUBSCRIPTION_ID" = "4d219645-c0cb-40bd-bedf-cbbda7f23a01" \
            || { echo "ERROR: Subscription ID mismatch"; exit 1; }

          test "$ACR_NAME" = "varunaks1793257564" \
            || { echo "ERROR: ACR name mismatch"; exit 1; }

          test "$ACR_LOGIN_SERVER" = "varunaks1793257564.azurecr.io" \
            || { echo "ERROR: ACR login server mismatch"; exit 1; }

          echo "All Azure secrets validated successfully."

      # Step 3: Authenticate to Azure using GitHub OIDC
      # Intentionally omit subscription-id for this diagnostic run
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Step 4: Inspect Azure CLI context and subscription visibility
      - name: Inspect Azure CLI context
        run: |
          echo "Azure CLI version:"
          az version

          echo "Current Azure account:"
          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            -o json

          echo "Subscriptions visible to GitHub Actions:"
          az account list --all \
            --query "[].{name:name,id:id,tenantId:tenantId,state:state}" \
            -o table

      # Step 5: Select the target subscription
      - name: Select Azure subscription
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az account set --subscription "$SUBSCRIPTION_ID"

          az account show \
            --query "{name:name,subscriptionId:id,tenantId:tenantId}" \
            -o json

      # Step 6: Login to Azure Container Registry
      - name: Login to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"

      # Step 7: Build Docker image
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/aks-demo-app:${GITHUB_SHA::7}"
          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .

      # Step 8: Push Docker image to ACR
      - name: Push Docker image to ACR
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/aks-demo-app:${GITHUB_SHA::7}"
          echo "Pushing image: $IMAGE"
          docker push "$IMAGE"

      # Step 9: Display published image
      - name: Show published image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          echo "Published image:"
          echo "${ACR_LOGIN_SERVER}/aks-demo-app:${GITHUB_SHA::7}"
