name: Build and Push Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout GitHub code
        uses: actions/checkout@v4

      # Step 2: Validate Azure secrets
      - name: Validate Azure secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          test "$CLIENT_ID" = "a907f788-008a-4d13-b65f-5e9301871301" \
            || { echo "ERROR: Client ID mismatch"; exit 1; }

          test "$TENANT_ID" = "b67ad627-6134-4210-8d55-1fba47bf7461" \
            || { echo "ERROR: Tenant ID mismatch"; exit 1; }

          test "$SUBSCRIPTION_ID" = "4d219645-c0cb-40bd-bedf-cbbda7f23a01" \
            || { echo "ERROR: Subscription ID mismatch"; exit 1; }

          test "$ACR_NAME" = "varunaks1793257564" \
            || { echo "ERROR: ACR name mismatch"; exit 1; }

          test "$ACR_LOGIN_SERVER" = "varunaks1793257564.azurecr.io" \
            || { echo "ERROR: ACR login server mismatch"; exit 1; }

          echo "All Azure secrets validated successfully."

      # Step 3: Authenticate to Azure using GitHub OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 4: Verify the selected subscription
      - name: Verify Azure subscription
        run: |
          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            -o json

      # Step 5: Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"

      # Step 6: Build the Docker image
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/aks-demo-app:${GITHUB_SHA::7}"
          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .

      # Step 7: Push the Docker image to ACR
      - name: Push image to ACR
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/aks-demo-app:${GITHUB_SHA::7}"
          echo "Pushing image: $IMAGE"
          docker push "$IMAGE"

      # Step 8: Display the published image
      - name: Show published image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          echo "Successfully published:"
          echo "${ACR_LOGIN_SERVER}/aks-demo-app:${GITHUB_SHA::7}"
