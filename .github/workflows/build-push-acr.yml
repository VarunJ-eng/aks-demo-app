
name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate required GitHub secrets
      - name: Validate Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            ACR_NAME \
            ACR_LOGIN_SERVER
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing."
              exit 1
            fi
          done

          echo "Required configuration values are present."

      # 3. Authenticate to Azure using GitHub OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Confirm the authenticated subscription
      - name: Verify Azure subscription
        shell: bash
        run: |
          set -e

          az account show \
            --query "{name:name,subscriptionId:id,tenantId:tenantId}" \
            --output json

      # 5. Authenticate Docker to Azure Container Registry
      - name: Login to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        shell: bash
        run: |
          set -e
          az acr login --name "$ACR_NAME"

      # 6. Build the Docker image
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -e

          SHORT_SHA="${IMAGE_TAG:0:7}"
          IMAGE="$ACR_LOGIN_SERVER/aks-demo-app:$SHORT_SHA"

          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 7. Push the image to ACR
      - name: Push Docker image
        shell: bash
        run: |
          set -e

          echo "Pushing image: $IMAGE"
          docker push "$IMAGE"

      # 8. Display the pushed image
      - name: Show published image
        run: |
          echo "Successfully pushed:"
          echo "$IMAGE"
