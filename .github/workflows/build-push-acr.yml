name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate GitHub repository secrets
      - name: Validate Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            ACR_NAME \
            ACR_LOGIN_SERVER
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing."
              exit 1
            fi
          done

          echo "All required secrets are configured."

      # 3. Verify OIDC token exchange and Azure subscription access
      - name: Diagnose Azure subscription access
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -e

          echo "Requesting GitHub OIDC token..."

          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          echo "Exchanging OIDC token for Azure Resource Manager access..."

          TOKEN_STATUS="$(curl -sS \
            -o /tmp/azure-token-response.json \
            -w '%{http_code}' \
            -X POST \
            "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode "client_id=$AZURE_CLIENT_ID" \
            --data-urlencode "scope=https://management.azure.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=$OIDC_TOKEN")"

          unset OIDC_TOKEN

          if [ "$TOKEN_STATUS" != "200" ]; then
            echo "Azure token exchange failed. HTTP status: $TOKEN_STATUS"

            python3 -c \
              'import json; d=json.load(open("/tmp/azure-token-response.json")); print(json.dumps({"error":d.get("error"),"error_description":d.get("error_description")},indent=2))'

            exit 1
          fi

          ARM_TOKEN="$(python3 -c \
            'import json; print(json.load(open("/tmp/azure-token-response.json"))["access_token"])')"

          echo "Checking subscription directly through Azure Resource Manager..."

          HTTP_STATUS="$(curl -sS \
            -o /tmp/subscription-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $ARM_TOKEN" \
            "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID?api-version=2022-12-01")"

          unset ARM_TOKEN

          echo "Subscription API HTTP status: $HTTP_STATUS"

          python3 -c \
            'import json; d=json.load(open("/tmp/subscription-response.json")); print(json.dumps({"subscriptionId":d.get("subscriptionId"),"displayName":d.get("displayName"),"state":d.get("state"),"error":d.get("error")},indent=2))'

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Subscription access check failed."
            exit 1
          fi

          echo "Subscription API check succeeded."

      # 4. Login to Azure using GitHub OIDC
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # 5. Verify Azure subscription context
      - name: Verify Azure subscription
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -e

          az account show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query '{name:name, subscriptionId:id, tenantId:tenantId, state:state}' \
            --output json

      # 6. Login to Azure Container Registry
      - name: Login to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        shell: bash
        run: |
          set -e

          az acr login --name "$ACR_NAME"

      # 7. Build Docker image
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA:0:7}"
          IMAGE="$ACR_LOGIN_SERVER/aks-demo-app:$IMAGE_TAG"

          echo "Building image: $IMAGE"

          docker build -t "$IMAGE" .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 8. Push Docker image to ACR
      - name: Push Docker image
        shell: bash
        run: |
          set -e

          echo "Pushing image: $IMAGE"

          docker push "$IMAGE"

          echo "Successfully pushed: $IMAGE"

      # 9. Display published image
      - name: Show published image
        shell: bash
        run: |
          echo "Published image: $IMAGE"
