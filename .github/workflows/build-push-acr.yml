name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate configuration
      - name: Validate Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            ACR_NAME \
            ACR_LOGIN_SERVER
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing."
              exit 1
            fi
          done

          echo "All required secrets are configured."

      # 3. Authenticate to ACR directly using GitHub OIDC
      #    This bypasses Azure CLI subscription discovery.
      - name: Authenticate to ACR using OIDC
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["value"])')"

          echo "Exchanging OIDC token for Azure access token..."

          TOKEN_STATUS="$(curl -sS \
            -o /tmp/azure-token-response.json \
            -w '%{http_code}' \
            -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${AZURE_CLIENT_ID}" \
            --data-urlencode "scope=https://management.azure.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=${OIDC_TOKEN}")"

          unset OIDC_TOKEN

          if [ "$TOKEN_STATUS" != "200" ]; then
            echo "Azure token exchange failed: HTTP $TOKEN_STATUS"

            python3 -c \
              'import json; d=json.load(open("/tmp/azure-token-response.json")); print(json.dumps({"error":d.get("error"),"error_description":d.get("error_description")},indent=2))'

            exit 1
          fi

          ARM_TOKEN="$(python3 -c \
            'import json; print(json.load(open("/tmp/azure-token-response.json"))["access_token"])')"

          echo "Checking Azure subscription access..."

          SUBSCRIPTION_STATUS="$(curl -sS \
            -o /tmp/subscription-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${ARM_TOKEN}" \
            "https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}?api-version=2022-12-01")"

          if [ "$SUBSCRIPTION_STATUS" != "200" ]; then
            echo "Subscription check failed: HTTP $SUBSCRIPTION_STATUS"

            python3 -c \
              'import json; d=json.load(open("/tmp/subscription-response.json")); print(json.dumps(d.get("error",d),indent=2))'

            unset ARM_TOKEN
            exit 1
          fi

          echo "Azure subscription access confirmed."

          echo "Exchanging Azure token for an ACR refresh token..."

          ACR_STATUS="$(curl -sS \
            -o /tmp/acr-token-response.json \
            -w '%{http_code}' \
            -X POST \
            "https://${ACR_LOGIN_SERVER}/oauth2/exchange" \
            --data-urlencode "grant_type=access_token" \
            --data-urlencode "service=${ACR_LOGIN_SERVER}" \
            --data-urlencode "tenant=${AZURE_TENANT_ID}" \
            --data-urlencode "access_token=${ARM_TOKEN}")"

          unset ARM_TOKEN

          if [ "$ACR_STATUS" != "200" ]; then
            echo "ACR token exchange failed: HTTP $ACR_STATUS"

            python3 -c \
              'import json; d=json.load(open("/tmp/acr-token-response.json")); print(json.dumps({"errors":d.get("errors"),"error":d.get("error"),"message":d.get("message")},indent=2))'

            exit 1
          fi

          ACR_TOKEN="$(python3 -c \
            'import json; print(json.load(open("/tmp/acr-token-response.json"))["refresh_token"])')"

          echo "::add-mask::${ACR_TOKEN}"

          echo "Logging Docker into ACR..."

          printf '%s' "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

          unset ACR_TOKEN

          echo "ACR authentication succeeded."

      # 4. Build Docker image
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA:0:7}"
          IMAGE="${ACR_LOGIN_SERVER}/aks-demo-app:${IMAGE_TAG}"

          echo "Building image: ${IMAGE}"

          docker build -t "$IMAGE" .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 5. Push image to ACR
      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing image: ${IMAGE}"

          docker push "$IMAGE"

          echo "Successfully pushed: ${IMAGE}"

      # 6. Display published image
      - name: Show published image
        shell: bash
        run: |
          echo "Published image: ${IMAGE}"
          
      - name: Set image tag
        shell: bash
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"


      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: VarunJ-eng/aks-demo-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops-repo

      - name: Update image tag in GitOps repository
        shell: bash
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail

          MANIFEST="gitops-repo/apps/aks-demo-app/deployment.yaml"

          # Update the container image in the Deployment manifest
          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*|\1${ACR_LOGIN_SERVER}/aks-demo-app:${IMAGE_TAG}|" \
            "$MANIFEST"

          # Verify the manifest changed correctly
          grep -E '^[[:space:]]*image:' "$MANIFEST"
          git -C gitops-repo diff --check

          # Configure Git commit identity
          git -C gitops-repo config user.name "github-actions[bot]"
          git -C gitops-repo config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit and push only if there is a change
          git -C gitops-repo add apps/aks-demo-app/deployment.yaml

          if git -C gitops-repo diff --cached --quiet; then
            echo "No image tag change to commit."
          else
            git -C gitops-repo commit \
              -m "Deploy aks-demo-app image ${IMAGE_TAG}"
            git -C gitops-repo push origin main
          fi

