
name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            ACR_NAME \
            ACR_LOGIN_SERVER
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing."
              exit 1
            fi
          done

          echo "All required secrets are configured."

      # Login without requiring subscription discovery to succeed.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Retry subscription discovery and selection.
      - name: Discover and select Azure subscription
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Subscription discovery attempt $attempt of 3"

            az account list --all \
              --query "[].{name:name,id:id,tenantId:tenantId,state:state}" \
              --output table || true

            if az account set --subscription "$AZURE_SUBSCRIPTION_ID"; then
              echo "Azure subscription selected."

              az account show \
                --query "{name:name,subscriptionId:id,tenantId:tenantId}" \
                --output json

              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "ERROR: The service principal cannot select the subscription."
          echo "Check subscription visibility for the authenticated Azure identity."
          exit 1

      # Authenticate Docker to ACR.
      - name: Login to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        shell: bash
        run: |
          set -e
          az acr login --name "$ACR_NAME"

      # Build the Docker image.
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA:0:7}"
          IMAGE="$ACR_LOGIN_SERVER/aks-demo-app:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Push the image to ACR.
      - name: Push Docker image
        shell: bash
        run: |
          set -e
          docker push "$IMAGE"
          echo "Successfully pushed: $IMAGE"
