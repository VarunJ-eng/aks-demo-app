
name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            ACR_NAME \
            ACR_LOGIN_SERVER
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing."
              exit 1
            fi
          done

          echo "All required secrets are configured."

      # Authenticate with GitHub OIDC and diagnose subscription access.
      - name: Diagnose Azure subscription access
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -e

          echo "Authenticating with GitHub OIDC..."

          TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$TOKEN" \
            --allow-no-subscriptions \
            --output none

          unset TOKEN

          echo "Checking direct access to the subscription..."

          ARM_TOKEN="$(az account get-access-token \
            --tenant "$AZURE_TENANT_ID" \
            --resource https://management.azure.com/ \
            --query accessToken -o tsv)"

          HTTP_STATUS="$(curl -sS \
            -o /tmp/subscription-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $ARM_TOKEN" \
            "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID?api-version=2022-12-01")"

          unset ARM_TOKEN

          echo "Subscription API HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            python3 -c \
              'import json; d=json.load(open("/tmp/subscription-response.json")); print(json.dumps({"subscriptionId":d.get("subscriptionId"),"displayName":d.get("displayName"),"state":d.get("state")}, indent=2))'
          else
            cat /tmp/subscription-response.json
            exit 1
          fi

      # Authenticate Docker to Azure Container Registry.
      - name: Login to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        shell: bash
        run: |
          set -e
          az acr login --name "$ACR_NAME"

      # Build the Docker image.
      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA:0:7}"
          IMAGE="$ACR_LOGIN_SERVER/aks-demo-app:$IMAGE_TAG"

          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Push the Docker image.
      - name: Push Docker image
        shell: bash
        run: |
          set -e

          echo "Pushing image: $IMAGE"
          docker push "$IMAGE"

          echo "Successfully pushed: $IMAGE"

      - name: Show published image
        shell: bash
        run: |
          echo "Published image: $IMAGE"
