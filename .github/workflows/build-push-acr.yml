name: Build and Push Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v4

      - name: Validate Azure secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test "$CLIENT_ID" = "a907f788-008a-4d13-b65f-5e9301871301" \
            && echo "Client ID matches" \
            || { echo "ERROR: Client ID mismatch"; exit 1; }

          test "$TENANT_ID" = "b67ad627-6134-4210-8d55-1fba47bf7461" \
            && echo "Tenant ID matches" \
            || { echo "ERROR: Tenant ID mismatch"; exit 1; }

          test "$SUBSCRIPTION_ID" = "4d219645-c0cb-40bd-bedf-cbbda7f23a01" \
            && echo "Subscription ID matches" \
            || { echo "ERROR: Subscription ID mismatch"; exit 1; }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Check visible subscriptions
        run: |
          az account list --all \
            --query "[].{name:name, id:id, tenantId:tenantId, state:state}" \
            -o table

      - name: Select Azure subscription
        run: |
          az account set \
            --subscription "4d219645-c0cb-40bd-bedf-cbbda7f23a01"

          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            -o table

      - name: Login to ACR
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build Docker image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/aks-demo-app:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" .

      - name: Push image to ACR
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/aks-demo-app:${GITHUB_SHA::7}"
          docker push "$IMAGE"
